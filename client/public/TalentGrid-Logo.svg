<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%">
  <defs>
    <!-- Deep Navy to Blue Gradient for 'T' -->
    <linearGradient id="t_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <!-- Teal to Vibrant Blue Gradient for 'G' Base Body -->
    <linearGradient id="g_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <!-- Warm Orange Accent Gradient for Verification Notch -->
    <linearGradient id="orange_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <!-- Clean Layering Drop Shadow -->
    <filter id="tg_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- LOGO MARK: Perfectly Balanced 'T' and 'G' Monogram -->
  <g transform="translate(10, 15)">
    <!-- THREE BACKGROUND PILLARS (The Grid Foundation) -->
    <rect x="22" y="10" width="12" height="100" rx="6" fill="#0284C7" opacity="0.12"/>
    <rect x="58" y="10" width="12" height="100" rx="6" fill="#0284C7" opacity="0.12"/>
    <rect x="94" y="10" width="12" height="100" rx="6" fill="#FF6B35" opacity="0.15"/>
    <!-- THE 'T' LETTERFORM (Height: 18px to 94px) -->
    <!-- 'T' Top Bar -->
    <rect x="5" y="18" width="62" height="14" rx="7" fill="url(#t_grad)" filter="url(#tg_shadow)"/>
    <!-- 'T' Stem -->
    <rect x="22" y="18" width="14" height="76" rx="7" fill="url(#t_grad)"/>
    <!-- THE 'G' LETTERFORM (Height: 18px to 94px — Perfectly Equal Size) -->
    <path d="M 100 38               L 100 31               C 100 24, 93 18, 85 18               L 64 18               C 52 18, 44 26, 44 38               L 44 74               C 44 86, 54 94, 68 94               L 85 94               C 93 94, 100 87, 100 78               L 100 56               L 72 56" fill="none" stroke="url(#g_grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#tg_shadow)" transform="translate(11.9 7.73) scale(0.881 0.862)"/>
    <!-- 'G' Inward Verification Crossbar Notch (Vibrant Orange Highlight) -->
    <rect x="72" y="49" width="28" height="14" rx="7" fill="url(#orange_grad)" stroke-width="0" transform="translate(8.73 4.54) scale(0.905 0.919)"/>
  </g>
</svg>